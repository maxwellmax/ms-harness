# test-commands.conf — FALLBACK table for resolving the consumer project's test
# command. Data only: this file is read by the loop, never executed.
#
# ---------------------------------------------------------------------------
# The two stack-agnostic sources of the test command
# ---------------------------------------------------------------------------
#
# (a) DECLARATIVE CONFIG — the primary source.
#     File name: `.ms-harness.conf`, at the invocation directory of the loop
#     (the consumer project root). It is the consumer project itself that
#     declares its test command, so the harness never has to guess.
#
#       Format : plain `key=value`, one per line.
#       Key    : `test_cmd=`   e.g.  test_cmd=make test
#       Comment: a line whose first non-blank character is `#`.
#       Unknown keys are ignored, so the file may carry other settings.
#       Blank lines are ignored. The value is everything after the first `=`,
#       with surrounding blanks trimmed; it is not a shell expression and is
#       not expanded when read.
#
#     Readable with `sed`/`grep` alone — `jq` is an optional dependency of this
#     harness and MUST NOT be required to read it.
#
# (b) THIS FALLBACK TABLE — consulted ONLY when no declarative config resolved
#     the command. It exists so a project that has declared nothing still gets
#     a suite gate; it is not, and must never become, the primary source.
#
# ---------------------------------------------------------------------------
# Traversal order is DOCUMENTED AND NON-SEMANTIC
# ---------------------------------------------------------------------------
#
# The order of the rules below carries NO meaning. No entry outranks another by
# language, framework, runtime, package manager or containerisation. The order
# exists for one reason only: to make a traversal of this file deterministic.
#
# It is deliberately never used to break a tie. When more than one rule matches
# the invocation directory, the loop warns, lists every matched candidate and
# DISABLES the suite gate. It never picks one and never lets this file's order
# decide — letting order decide is exactly the semantic precedence between
# stacks that this table exists to not have.
#
# ---------------------------------------------------------------------------
# Grammar
# ---------------------------------------------------------------------------
#
#   <rule>    ::= <probe> " :: " <command>
#   <probe>   ::= <clause> { " || " <clause> }
#   <clause>  ::= "exists " <path>
#               | "contains " <path> " " <extended-regexp>
#
# A rule matches when ANY of its clauses matches (`||` is alternation, so a
# single ecosystem with two possible manifests stays ONE rule and therefore one
# candidate). `exists` is a plain file test. `contains` is true when the file
# exists AND matches the POSIX extended regular expression, as by `grep -qE`.
#
# Probing inspects ONLY the invocation directory: no recursive scan, no walking
# up to parent directories.
#
# Parsing: a pure `while IFS= read -r line` loop is enough — no `jq`, no `awk`,
# no `eval`. Skip a line whose first character is `#` and any blank line, then
# split the fields with parameter expansion (`${line%% :: *}` / `${line#* :: }`)
# so that no field is ever subjected to pathname expansion. A reader that splits
# with unquoted `$probe` MUST `set -f` first, because a clause regexp may
# contain glob metacharacters.
#
# Language and package-manager names appear below as DATA inside these rows,
# which is the only place in the harness where they may appear. They must never
# become a branch of control flow.
#
# ---------------------------------------------------------------------------
# Rules
# ---------------------------------------------------------------------------

contains composer.json "test"[[:space:]]*: :: composer test
contains package.json "test"[[:space:]]*: :: npm test
exists pytest.ini || contains pyproject.toml \[tool\.pytest :: pytest
exists go.mod :: go test ./...
exists Cargo.toml :: cargo test
